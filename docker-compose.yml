version: '3.8'

services:
  mock-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mock-mock:latest
    container_name: mock-mock-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - USE_FIRESTORE=false
    # Uncomment for Firestore support
    # volumes:
    #   - ./path/to/serviceAccountKey.json:/app/server/src/path/to/serviceAccountKey.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - mock-network

networks:
  mock-network:
    driver: bridge
