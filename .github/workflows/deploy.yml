name: Deploy Mock-Mock to GCP

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint || echo "No lint script found"
        continue-on-error: true

      - name: Run tests
        run: npm test || echo "No tests found"
        continue-on-error: true

  preview-dev:
    name: Preview Dev Environment
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    needs: lint-and-test
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_DEV }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Install Pulumi dependencies
        working-directory: infra
        run: npm ci

      - name: Login to Pulumi (GCS backend)
        working-directory: infra
        run: pulumi login gs://${{secrets.GCP_PROJECT_ID_DEV }}-pulumi-state

      - name: Select Pulumi stack
        working-directory: infra
        run: |
          pulumi stack select dev || pulumi stack init dev

      - name: Pulumi preview
        working-directory: infra
        run: |
          pulumi preview --diff --suppress-outputs
        env:
          PULUMI_CONFIG_PASSPHRASE: ""

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: preview-dev
    environment:
      name: dev
      url: ${{ steps.pulumi.outputs.serviceUrl }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_DEV }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Create Firebase secret file
        working-directory: infra
        run: |
          mkdir -p secrets
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}' > secrets/firebase-dev.json

      - name: Install Pulumi dependencies
        working-directory: infra
        run: npm ci

      - name: Login to Pulumi (GCS backend)
        working-directory: infra
        run: pulumi login gs://${{ secrets.GCP_PROJECT_ID_DEV }}-pulumi-state

      - name: Select Pulumi stack
        working-directory: infra
        run: |
          pulumi stack select dev || pulumi stack init dev

      - name: Deploy with Pulumi
        id: pulumi
        working-directory: infra
        run: |
          pulumi up --yes --suppress-outputs
          echo "serviceUrl=$(pulumi stack output serviceUrl)" >> $GITHUB_OUTPUT
        env:
          PULUMI_CONFIG_PASSPHRASE: ""

      - name: Summary
        run: |
          echo "### Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** dev" >> $GITHUB_STEP_SUMMARY
          echo "**Service URL:** ${{ steps.pulumi.outputs.serviceUrl }}" >> $GITHUB_STEP_SUMMARY

  preview-prod:
    name: Preview Prod Environment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: lint-and-test
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_PROD }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Install Pulumi dependencies
        working-directory: infra
        run: npm ci

      - name: Login to Pulumi (GCS backend)
        working-directory: infra
        run: pulumi login gs://${{ secrets.GCP_PROJECT_ID_PROD }}-pulumi-state

      - name: Select Pulumi stack
        working-directory: infra
        run: |
          pulumi stack select prod || pulumi stack init prod

      - name: Pulumi preview
        working-directory: infra
        run: |
          pulumi preview --diff --suppress-outputs
        env:
          PULUMI_CONFIG_PASSPHRASE: ""

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: preview-prod
    environment:
      name: prod
      url: ${{ steps.pulumi.outputs.serviceUrl }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_PROD }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Create Firebase secret file
        working-directory: infra
        run: |
          mkdir -p secrets
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}' > secrets/firebase-prod.json

      - name: Install Pulumi dependencies
        working-directory: infra
        run: npm ci

      - name: Login to Pulumi (GCS backend)
        working-directory: infra
        run: pulumi login gs://${{ secrets.GCP_PROJECT_ID_PROD }}-pulumi-state

      - name: Select Pulumi stack
        working-directory: infra
        run: |
          pulumi stack select prod || pulumi stack init prod

      - name: Deploy with Pulumi
        id: pulumi
        working-directory: infra
        run: |
          pulumi up --yes --suppress-outputs
          echo "serviceUrl=$(pulumi stack output serviceUrl)" >> $GITHUB_OUTPUT
        env:
          PULUMI_CONFIG_PASSPHRASE: ""

      - name: Summary
        run: |
          echo "### Production Deployment Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** prod" >> $GITHUB_STEP_SUMMARY
          echo "**Service URL:** ${{ steps.pulumi.outputs.serviceUrl }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please verify the deployment is working correctly." >> $GITHUB_STEP_SUMMARY
